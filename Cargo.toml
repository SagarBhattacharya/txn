[package]
name = "txn"
version = "0.1.0"
edition = "2024"

[dependencies]
# Tokio
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "signal"] }

# Data & serialization
rust_decimal = { version = "1.43.0", features = ["serde", "macros"] }
chrono = { version = "0.4.45", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# Web & HTTP
axum = { version = "0.8.9" }
tower-http = { version = "0.7.1", features = ["trace"] }

# Security & Auth
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
argon2 = { version = "0.6.0", features = ["rand_core"] }
sha2 = "0.11.0"
secrecy = "0.10.3"

# Observability & Config
thiserror = "2.0.21"
dotenvy = "0.15.7"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
envconfig = "0.11.1"

# Database
[dependencies.sqlx]
version = "0.9.0"
default-features = false
features = [
	"runtime-tokio",
	"postgres",
	"macros",
	"migrate",
	"rust_decimal",
	"chrono"
]

[dev-dependencies]
uuid = { version = "1.27.0", features = ["v4"] }
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
hdrhistogram = "7.6.0"
reqwest = { version = "0.13.5", features = ["json"] }

[profile.release]
strip = true
lto = "thin"

[[bench]]
name = "transfer"
harness = false

[[bench]]
name = "contention"
harness = false

[[bench]]
name = "idempotency"
harness = false

[[bench]]
name = "reversal"
harness = false

[[bench]]
name = "reads"
harness = false

[[bench]]
name = "history"
harness = false