[package]
name = "txn"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.53.1", features = ["full"] }
rust_decimal = { version = "1.43.0", features = ["serde", "macros"] }
chrono = { version = "0.4.45", features = ["serde"] }
thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"] }
dotenvy = "0.15.7"
axum = "0.8.9"
serde_json = "1.0.151"
http-body-util = "0.1.5"
tower = "0.5.3"
envconfig = "0.11.1"
uuid = { version = "1.27.0", features = ["v4"] }
futures = "0.3.34"

[dependencies.sqlx]
version = "0.9.0"
features = [
	"runtime-tokio",
	"postgres",
	"macros",
	"rust_decimal",
	"chrono"
]