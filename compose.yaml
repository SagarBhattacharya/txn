services:
  postgres:
    image: postgres:18-alpine
    container_name: txn-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ledger_user
      POSTGRES_PASSWORD: ledger_secret
      POSTGRES_DB: ledger_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger_user -d ledger_db"]
      interval: 3s
      timeout: 3s
      retries: 5

  prometheus:
    image: prom/prometheus:0.15
    container_name: txn-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pg_data: